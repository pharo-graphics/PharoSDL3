name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"   # Run every Monday at 08:00

jobs:
  test:
    strategy:
      # Default value means that a failure in one combination cancels all 
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-14 ]
        os: [ macos-latest, windows-latest ] # ubuntu-latest: video initialization fails
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          # install-linux-dependencies: true
      - uses: actions/checkout@v7
      - uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        env:
          LD_LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib
        shell: bash
      - run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        if: ${{ runner.os == 'Windows' }}
        env:
          PATH: ${{ steps.sdl.outputs.prefix }}/bin
        shell: bash
      - name: Smoke test demos
        run: |
          # Debug: show VM and image paths
          echo "SMALLTALK_CI_VM=$SMALLTALK_CI_VM"
          echo "SMALLTALK_CI_IMAGE=$SMALLTALK_CI_IMAGE"
          ls -la "$SMALLTALK_CI_VM" "$SMALLTALK_CI_IMAGE" 2>&1 || true
          echo "--- VM wrapper contents ---"
          cat -v "$SMALLTALK_CI_VM" 2>&1 || true
          echo "---"

          # Fix potential Windows \r in VM wrapper
          sed -i 's/\r$//' "$SMALLTALK_CI_VM" 2>/dev/null || true
          
          DEMOS=$("$SMALLTALK_CI_VM" "$SMALLTALK_CI_IMAGE" eval \
            "String streamContents: [ :s |
              (SDL3App allSubclasses reject: #isAbstract)
                do: [ :each | s nextPutAll: each name ]
                separatedBy: [ s nextPut: Character lf ] ]" | tr -d "'")

          echo "$DEMOS" | while IFS= read -r demo; do
            [ -z "$demo" ] && continue
            echo "=== Smoke testing: $demo ==="
            "$SMALLTALK_CI_VM" "$SMALLTALK_CI_IMAGE" eval "$demo new runForSeconds: 5" \
              || { echo "FAILED: $demo"; exit 1; }
          done
        env:
          SMALLTALK_CI_VM: ${{ steps.smalltalkci.outputs.vm }}
          SMALLTALK_CI_IMAGE: ${{ steps.smalltalkci.outputs.image }}
          LD_LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib
        shell: bash

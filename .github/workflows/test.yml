name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"   # Run every Monday at 08:00

jobs:
  test:
    strategy:
      # Default value means that a failure in one combination cancels all 
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-14 ]
        os: [ macos-latest, windows-latest ] # ubuntu-latest: video initialization fails
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          # install-linux-dependencies: true
      - uses: actions/checkout@v7
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Unit tests (Unix)
        run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        env:
          LD_LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib
        shell: bash
      - name: Unit tests (Windows)
        run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        if: ${{ runner.os == 'Windows' }}
        env:
          PATH: ${{ steps.sdl.outputs.prefix }}/bin
        shell: bash
      - name: Smoke test demos (Unix)
        run: |
          export PATH="${{ steps.sdl.outputs.prefix }}/bin:$PATH"
          $GITHUB_WORKSPACE/scripts/smokeTestDemos.sh "" "$SMALLTALK_CI_VM $SMALLTALK_CI_IMAGE"
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        env:
          LD_LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib
          SDL_AUDIO_DRIVER: dummy
        shell: bash
      - name: Smoke test demos (Windows)
        run: |
          export PATH="${{ steps.sdl.outputs.prefix }}/bin:$PATH"
          source "$HOME/.smalltalkCI/env_vars"
          $GITHUB_WORKSPACE/scripts/smokeTestDemos.sh "" "$SMALLTALK_CI_VM $SMALLTALK_CI_IMAGE"
        if: ${{ runner.os == 'Windows' }}
        env:
          PATH: ${{ steps.sdl.outputs.prefix }}/bin
          SDL_AUDIO_DRIVER: dummy
        shell: bash
